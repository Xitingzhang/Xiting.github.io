<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品信息管理工具</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 2.5rem;
        }

        /* 卡片样式 */
        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #34495e;
            font-size: 1.5rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* 按钮样式 */
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-danger {
            background-color: #e74c3c;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-edit {
            background-color: #f39c12;
        }

        .btn-edit:hover {
            background-color: #e67e22;
        }

        /* 表格样式 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }

        table tr:hover {
            background-color: #f5f7fa;
        }

        /* 搜索框样式 */
        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            background-color: #f8f9fa;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 15px;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 10px;
                margin-right: 0;
            }
            
            table th,
            table td {
                padding: 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 产品信息管理工具</h1>
        
        <!-- 添加产品表单 -->
        <div class="card">
            <h2>➕ 添加新产品</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">产品名称</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productModel">产品型号</label>
                    <input type="text" id="productModel" required>
                </div>
                <div class="form-group">
                    <label for="productPrice">产品价格</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="productMaterial">产品材质</label>
                    <input type="text" id="productMaterial" required>
                </div>
                <div class="form-group">
                    <label for="productSpecs">产品规格</label>
                    <input type="text" id="productSpecs" required>
                </div>
                <div class="form-group">
                    <label for="productNotes">产品备注</label>
                    <textarea id="productNotes"></textarea>
                </div>
                <button type="submit" class="btn">保存产品</button>
                <button type="button" class="btn btn-danger" onclick="clearForm()">清空表单</button>
            </form>
        </div>
        
        <!-- 产品列表 -->
        <div class="card">
            <h2>📋 产品列表</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 搜索产品名称或型号...">
            </div>
            <div class="table-container">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>产品名称</th>
                            <th>产品型号</th>
                            <th>产品价格</th>
                            <th>产品材质</th>
                            <th>产品规格</th>
                            <th>产品备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- 产品数据将通过JavaScript动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 初始化产品数据 - 这里可以添加默认产品
        let products = [
            {
                id: Date.now() - 3,
                name: "小米13",
                model: "MI13",
                price: 3999,
                material: "玻璃+金属",
                specs: "6.36英寸，8GB+256GB",
                notes: "2023年旗舰机型，徕卡影像"
            },
            {
                id: Date.now() - 2,
                name: "华为Mate 50",
                model: "MATE50",
                price: 4999,
                material: "素皮+金属",
                specs: "6.74英寸，8GB+256GB",
                notes: "搭载骁龙8+ Gen1，可变光圈"
            },
            {
                id: Date.now() - 1,
                name: "iPhone 14",
                model: "IP14",
                price: 5999,
                material: "玻璃+金属",
                specs: "6.1英寸，6GB+128GB",
                notes: "A15仿生芯片，卫星通信"
            }
        ];

        // 页面加载完成后渲染产品列表
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            // 监听表单提交事件
            document.getElementById('productForm').addEventListener('submit', handleFormSubmit);
            // 监听搜索框输入事件
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        });

        // 渲染产品列表
        function renderProducts(filteredProducts = products) {
            const tableBody = document.getElementById('productTableBody');
            tableBody.innerHTML = '';
            
            filteredProducts.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.name}</td>
                    <td>${product.model}</td>
                    <td>¥${product.price.toFixed(2)}</td>
                    <td>${product.material}</td>
                    <td>${product.specs}</td>
                    <td>${product.notes || '-'}</td>
                    <td>
                        <button class="btn btn-edit" onclick="editProduct(${product.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${product.id})">删除</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 处理表单提交
        function handleFormSubmit(e) {
            e.preventDefault();
            
            // 获取表单数据
            const productData = {
                id: Date.now(),
                name: document.getElementById('productName').value,
                model: document.getElementById('productModel').value,
                price: parseFloat(document.getElementById('productPrice').value),
                material: document.getElementById('productMaterial').value,
                specs: document.getElementById('productSpecs').value,
                notes: document.getElementById('productNotes').value
            };
            
            // 添加产品到数组
            products.push(productData);
            
            // 重新渲染产品列表
            renderProducts();
            
            // 清空表单
            clearForm();
            
            // 提示成功
            alert('产品添加成功！');
        }

        // 清空表单
        function clearForm() {
            document.getElementById('productForm').reset();
        }

        // 编辑产品
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            // 填充表单
            document.getElementById('productName').value = product.name;
            document.getElementById('productModel').value = product.model;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productMaterial').value = product.material;
            document.getElementById('productSpecs').value = product.specs;
            document.getElementById('productNotes').value = product.notes;
            
            // 删除原产品
            products = products.filter(p => p.id !== id);
            
            // 滚动到表单顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 删除产品
        function deleteProduct(id) {
            if (confirm('确定要删除这个产品吗？')) {
                products = products.filter(p => p.id !== id);
                renderProducts();
                alert('产品删除成功！');
            }
        }

        // 搜索产品
        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) || 
                product.model.toLowerCase().includes(searchTerm)
            );
            renderProducts(filteredProducts);
        }
    </script>
</body>
</html>
