<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品信息管理工具</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 2.5rem;
        }

        /* 卡片样式 */
        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #34495e;
            font-size: 1.5rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* 表单即时验证样式 */
        .form-group input:invalid:not(:placeholder-shown),
        .form-group textarea:invalid:not(:placeholder-shown) {
            border-color: #e74c3c;
        }
        .form-group input:valid:not(:placeholder-shown),
        .form-group textarea:valid:not(:placeholder-shown) {
            border-color: #2ecc71;
        }

        /* 按钮样式 */
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: #e74c3c;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-edit {
            background-color: #f39c12;
        }

        .btn-edit:hover {
            background-color: #e67e22;
        }

        /* 表格样式 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }

        table tr:hover {
            background-color: #f5f7fa;
        }

        /* 搜索框样式 */
        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            background-color: #f8f9fa;
        }

        /* 手机端自适应样式 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 15px;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 10px;
                margin-right: 0;
            }
            
            /* 小屏手机（<480px）竖排布局 */
            @media (max-width: 480px) {
                table {
                    border: 0;
                }
                
                table thead {
                    display: none;
                }
                
                table tr {
                    display: block;
                    margin-bottom: 15px;
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    overflow: hidden;
                }
                
                table td {
                    display: block;
                    text-align: right;
                    padding-left: 50%;
                    position: relative;
                    border-bottom: 1px solid #f5f5f5;
                }
                
                table td:last-child {
                    border-bottom: none;
                }
                
                table td::before {
                    content: attr(data-label);
                    position: absolute;
                    left: 0;
                    width: 50%;
                    padding-left: 15px;
                    font-weight: 600;
                    text-align: left;
                    color: #3498db;
                }
                
                /* 操作按钮横向排列 */
                table td:last-child {
                    display: flex;
                    padding: 10px;
                    justify-content: space-around;
                }
                
                table td:last-child::before {
                    display: none;
                }
                
                table td .btn {
                    width: 48%;
                    margin: 0;
                    font-size: 0.85rem;
                    padding: 6px 8px;
                }
            }
            
            /* 大屏手机（480px-768px）两列布局 */
            @media (min-width: 480px) {
                table thead {
                    display: table-header-group;
                }
                
                table tr {
                    display: table-row;
                    border: none;
                    margin-bottom: 0;
                    position: relative;
                }
                
                table td {
                    display: table-cell;
                    text-align: left;
                    padding: 8px 6px;
                    border-bottom: 1px solid #ddd;
                    padding-left: 8px;
                }
                
                table th {
                    padding: 10px 6px;
                    font-size: 0.9rem;
                }
                
                table td::before {
                    display: none;
                }
                
                /* 隐藏备注列，通过悬浮显示 */
                table td:nth-child(6), table th:nth-child(6) {
                    display: none;
                }
                
                table td:last-child {
                    min-width: 120px;
                }
                
                /* 悬浮显示完整备注 */
                table tr:hover::after {
                    content: attr(data-notes);
                    position: absolute;
                    bottom: 100%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #333;
                    color: white;
                    padding: 8px 12px;
                    border-radius: 4px;
                    font-size: 0.9rem;
                    white-space: nowrap;
                    z-index: 100;
                    margin-bottom: 5px;
                }
                
                table td .btn {
                    width: 48%;
                    margin: 0;
                    font-size: 0.85rem;
                    padding: 6px 8px;
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 产品信息管理工具</h1>
        
        <!-- 添加产品表单 -->
        <div class="card">
            <h2>➕ 添加新产品</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">产品名称</label>
                    <input type="text" id="productName" required placeholder="请输入产品名称">
                </div>
                <div class="form-group">
                    <label for="productModel">产品型号</label>
                    <input type="text" id="productModel" required placeholder="请输入产品型号">
                </div>
                <div class="form-group">
                    <label for="productPrice">产品价格</label>
                    <input type="number" id="productPrice" step="0.01" min="0" required placeholder="请输入产品价格">
                </div>
                <div class="form-group">
                    <label for="productMaterial">产品材质</label>
                    <input type="text" id="productMaterial" required placeholder="请输入产品材质">
                </div>
                <div class="form-group">
                    <label for="productSpecs">产品规格</label>
                    <input type="text" id="productSpecs" required placeholder="请输入产品规格">
                </div>
                <div class="form-group">
                    <label for="productNotes">产品备注</label>
                    <textarea id="productNotes" placeholder="请输入产品备注（可选）"></textarea>
                </div>
                <button type="submit" class="btn">保存产品</button>
                <button type="button" class="btn btn-danger" onclick="clearForm()">清空表单</button>
            </form>
        </div>
        
        <!-- 产品列表 -->
        <div class="card">
            <h2>📋 产品列表</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 搜索产品名称或型号...">
            </div>
            <div class="table-container">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>产品名称</th>
                            <th>产品型号</th>
                            <th>产品价格</th>
                            <th>产品材质</th>
                            <th>产品规格</th>
                            <th>产品备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- 产品数据将通过JavaScript动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 全局状态管理
        let products = [];
        let editingProductId = null;
        let isSubmitting = false;

        // 防抖工具函数
        function debounce(func, delay = 300) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // 页面加载初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadProductsFromLocalStorage();
            renderProducts();
            document.getElementById('productForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('searchInput').addEventListener('input', debounce(handleSearch));
        });

        // 从本地存储加载数据
        function loadProductsFromLocalStorage() {
            try {
                const savedProducts = localStorage.getItem('products');
                if (savedProducts) {
                    const parsed = JSON.parse(savedProducts);
                    // 校验数据格式合法性
                    if (Array.isArray(parsed) && parsed.every(p => typeof p === 'object' && p.id)) {
                        products = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.error('加载本地数据失败:', e);
            }
            // 使用预设数据
            products = [
                {
                    id: Date.now() - 3,
                    name: "小米13",
                    model: "MI13",
                    price: 3999,
                    material: "玻璃+金属",
                    specs: "6.36英寸，8GB+256GB",
                    notes: "2023年旗舰机型，徕卡影像"
                },
                {
                    id: Date.now() - 2,
                    name: "华为Mate 50",
                    model: "MATE50",
                    price: 4999,
                    material: "素皮+金属",
                    specs: "6.74英寸，8GB+256GB",
                    notes: "搭载骁龙8+ Gen1，可变光圈"
                },
                {
                    id: Date.now() - 1,
                    name: "iPhone 14",
                    model: "IP14",
                    price: 5999,
                    material: "玻璃+金属",
                    specs: "6.1英寸，6GB+128GB",
                    notes: "A15仿生芯片，卫星通信"
                }
            ];
            saveProductsToLocalStorage();
        }

        // 保存数据到本地存储
        function saveProductsToLocalStorage() {
            try {
                const totalSize = JSON.stringify(products).length;
                const maxSize = 5 * 1024 * 1024; // 微信浏览器存储限制约5MB
                const usedPercent = ((totalSize / maxSize) * 100).toFixed(2);
                
                // 容量预警
                if (totalSize > maxSize * 0.8) {
                    alert(`存储容量已使用${usedPercent}%，建议清理旧数据`);
                }
                
                localStorage.setItem('products', JSON.stringify(products));
            } catch (e) {
                console.error('本地存储失败:', e);
                alert('数据保存失败，请检查浏览器存储权限');
            }
        }

        // 渲染产品列表
        function renderProducts(filteredProducts = products) {
            const tableBody = document.getElementById('productTableBody');
            tableBody.innerHTML = '';
            
            filteredProducts.forEach(product => {
                const row = document.createElement('tr');
                row.setAttribute('data-notes', product.notes || '暂无备注');
                row.innerHTML = `
                    <td data-label="产品名称">${product.name || '暂无'}</td>
                    <td data-label="产品型号">${product.model || '暂无'}</td>
                    <td data-label="产品价格">¥${product.price ? product.price.toFixed(2) : '暂无'}</td>
                    <td data-label="产品材质">${product.material || '暂无'}</td>
                    <td data-label="产品规格">${product.specs || '暂无'}</td>
                    <td data-label="产品备注">${product.notes || '暂无'}</td>
                    <td data-label="操作">
                        <button class="btn btn-edit" onclick="editProduct(${product.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${product.id})">删除</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 处理表单提交
        function handleFormSubmit(e) {
            e.preventDefault();
            if (isSubmitting) return;
            
            isSubmitting = true;
            const submitBtn = document.querySelector('#productForm .btn[type="submit"]');
            submitBtn.disabled = true;
            
            const productData = {
                id: editingProductId || Date.now(),
                name: document.getElementById('productName').value.trim(),
                model: document.getElementById('productModel').value.trim(),
                price: parseFloat(document.getElementById('productPrice').value),
                material: document.getElementById('productMaterial').value.trim(),
                specs: document.getElementById('productSpecs').value.trim(),
                notes: document.getElementById('productNotes').value.trim()
            };
            
            try {
                if (editingProductId) {
                    // 编辑模式：更新现有产品
                    const index = products.findIndex(p => p.id === editingProductId);
                    if (index !== -1) {
                        products[index] = productData;
                        alert('产品修改成功！');
                    }
                    // 重置编辑状态
                    editingProductId = null;
                    submitBtn.textContent = '保存产品';
                } else {
                    // 新增模式：添加新产品
                    products.push(productData);
                    alert('产品添加成功！');
                }
                
                saveProductsToLocalStorage();
                renderProducts();
                clearForm();
            } catch (e) {
                console.error('提交失败:', e);
                alert('操作失败，请稍后重试');
            } finally {
                setTimeout(() => {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                }, 1000);
            }
        }

        // 辅助功能
        function clearForm() {
            document.getElementById('productForm').reset();
            editingProductId = null;
            document.querySelector('#productForm .btn[type="submit"]').textContent = '保存产品';
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            editingProductId = id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productModel').value = product.model;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productMaterial').value = product.material;
            document.getElementById('productSpecs').value = product.specs;
            document.getElementById('productNotes').value = product.notes;
            
            // 滚动到表单区域
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelector('#productForm .btn[type="submit"]').textContent = '保存修改';
        }

        function deleteProduct(id) {
            if (confirm('确定要删除这个产品吗？')) {
                products = products.filter(p => p.id !== id);
                saveProductsToLocalStorage();
                renderProducts();
                alert('产品删除成功！');
            }
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) || 
                product.model.toLowerCase().includes(searchTerm)
            );
            renderProducts(filteredProducts);
        }
    </script>
</body>
</html>
